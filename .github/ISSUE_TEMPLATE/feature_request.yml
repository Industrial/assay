name: Feature request
description: Suggest a new claim, command, flag or workflow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to test or do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you would like. A sketch of the suite or command line helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how nix-unit / runTests / namaka handle it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - assay (runner / DSL)
        - nixq
        - nixdrv
        - nixstore
        - nixfetch
        - docs / packaging
