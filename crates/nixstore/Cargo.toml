[package]
name = "nixstore"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "nixstore — read-only Nix store path-info from db.sqlite"
license = "MIT"
repository = "https://github.com/Industrial/assay"
homepage = "https://github.com/Industrial/assay"
documentation = "https://docs.rs/nixstore"
readme = "README.md"
keywords = ["nix", "store"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }

id_effect = { version = "0.4.0", features = ["schema-serde"] }
id_effect_macro = "0.4.0"
id_effect_proc_macro = "0.4.0"
id_effect_cli = { version = "0.4.0", optional = true }

[features]
default = ["cli-exit"]
cli-exit = ["dep:id_effect_cli"]

[lib]
name = "nixstore"
path = "src/lib/mod.rs"

[[bin]]
name = "nixstore"
path = "src/main.rs"
