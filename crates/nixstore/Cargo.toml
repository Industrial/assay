[package]
name = "nixstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "nixstore — read-only Nix store path-info from db.sqlite"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nixstore"
readme = "README.md"
keywords = ["nix", "store"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
base64.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }

id_effect.workspace = true
# The bin's run edge (`run_main`: Ctrl-C -> 130, defect -> 101); always linked.
id_effect_cli.workspace = true

[features]
default = ["cli-exit"]
# Kept for compatibility: id_effect_cli is no longer optional, so this is a no-op.
cli-exit = []
# Exposes `MockPathInfoStore` (in-memory fake) for dependents' tests.
test-support = []

[lints]
workspace = true

[lib]
name = "nixstore"
path = "src/lib/mod.rs"

[[bin]]
name = "nixstore"
path = "src/main.rs"
