# Legacy release assets, called by release.yml (dist `post-announce-jobs`) after dist has
# created the GitHub release.
#
# Before 0.4 the release workflow published `assay-<target>.tar.gz` containing
# `assay-<target>/assay` (binary only). Downstream pins depend on that URL and layout, e.g.
# Industrial/cursor-setup nix/features/program-assay.nix:
#   https://github.com/Industrial/assay/releases/download/v${version}/assay-x86_64-unknown-linux-gnu.tar.gz
#   sourceRoot = "assay-x86_64-unknown-linux-gnu";
# dist names its archives `nix-assay-<target>.tar.gz` (dir `nix-assay-<target>/` with assay,
# README.md, LICENSE, CHANGELOG.md), so this job re-packs the binary from those archives —
# no second build — and uploads the old names with a `.sha256` next to each.
name: release-legacy-assets
on:
  workflow_call:
    inputs:
      plan:
        description: dist-manifest JSON from the dist `plan`/`host` job.
        required: true
        type: string
permissions:
  contents: write
jobs:
  legacy-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - name: Re-pack dist archives under the legacy names
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/legacy"
          mkdir -p "$work/in" "$work/out"
          # The three targets released before dist; new targets only ship the dist names.
          for target in x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            src="nix-assay-$target.tar.gz"
            legacy="assay-$target"
            gh release download "$TAG" --pattern "$src" --pattern "$src.sha256" --dir "$work/in" --clobber
            (cd "$work/in" && sha256sum --check --strict "$src.sha256")
            rm -rf "${work:?}/stage"
            mkdir -p "$work/stage/$legacy"
            tar -xzf "$work/in/$src" -C "$work/stage" "nix-assay-$target/assay"
            install -m 755 "$work/stage/nix-assay-$target/assay" "$work/stage/$legacy/assay"
            tar -C "$work/stage" -czf "$work/out/$legacy.tar.gz" "$legacy"
            (cd "$work/out" && sha256sum "$legacy.tar.gz" | tee "$legacy.tar.gz.sha256")
          done
          gh release upload "$TAG" --clobber "$work"/out/*
