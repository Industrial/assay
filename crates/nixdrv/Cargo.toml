[package]
name = "nixdrv"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "nixdrv — derivation ATerm/JSON parse, project outs/inputs, CA store-path helpers"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nixdrv"
readme = "README.md"
keywords = ["nix", "derivation"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
hex = "0.4"
nixq = { path = "../nixq", version = "0.2.1" }
nixstore = { path = "../nixstore", version = "0.2.1" }

id_effect = "0.13.0"
# The bin's run edge (`run_main`: Ctrl-C -> 130, defect -> 101); always linked.
id_effect_cli = "0.13.0"

[dev-dependencies]
rstest = "0.23"
nixq = { path = "../nixq", version = "0.2.1", features = ["test-support"] }

[features]
default = ["cli-exit"]
# Kept for compatibility: id_effect_cli is no longer optional, so this is a no-op.
cli-exit = []

[lib]
name = "nixdrv"
path = "src/lib/mod.rs"

[[bin]]
name = "nixdrv"
path = "src/main.rs"
