[package]
name = "nixfetch"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "nixfetch — fixed-output fetchurl/fetchgit download + flat/NAR hash verify"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nixfetch"
readme = "README.md"
exclude = ["fixtures/**"]
keywords = ["nix", "fetch", "hash"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
base64 = "0.22"
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
nixdrv = { path = "../nixdrv", version = "0.2.1" }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

id_effect = { version = "0.4.0", features = ["schema-serde"] }
id_effect_macro = "0.4.0"
id_effect_proc_macro = "0.4.0"
id_effect_cli = { version = "0.4.0", optional = true }

[features]
default = ["cli-exit"]
cli-exit = ["dep:id_effect_cli"]

[lib]
name = "nixfetch"
path = "src/lib/mod.rs"

[[bin]]
name = "nixfetch"
path = "src/main.rs"
