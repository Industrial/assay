[workspace]
resolver = "3"
members = [
  "crates/assay",
  "crates/bin-contract-support",
  "crates/nixdrv",
  "crates/nixfetch",
  "crates/nixq",
  "crates/nixstore",
]

# Single version and shared metadata for all workspace crates (inherit with version.workspace = true).
[workspace.package]
version = "0.3.0"
edition = "2024"
# id_effect 0.13 needs rustc >= 1.94.
rust-version = "1.94"
license = "MIT"
authors = ["Industrial <tom.wieland@gmail.com>"]
repository = "https://github.com/Industrial/assay"
homepage = "https://github.com/Industrial/assay"

# Versions shared by two or more crates; members opt in with `name.workspace = true` (adding
# their own `features` / `optional`). Internal crates carry `version` so they can be published.
[workspace.dependencies]
nixdrv = { path = "crates/nixdrv", version = "0.3.0" }
nixq = { path = "crates/nixq", version = "0.3.0" }
nixstore = { path = "crates/nixstore", version = "0.3.0" }
# Test-only, unpublished: path-only so cargo strips it from packaged manifests.
bin-contract-support = { path = "crates/bin-contract-support" }

id_effect = "0.13.0"
id_effect_cli = "0.13.0"

base64 = "0.22"
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false }

# `cargo dylint` sets `cfg(dylint_lib = "…")`, used by the narrow `cfg_attr(…, allow(…))`s.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(dylint_lib, values("id_effect_lints"))',
] }
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"
missing_docs = "warn"

# CI runs clippy with `-D warnings`, so every `warn` here is a hard gate.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"

# Line tables keep backtraces useful at a fraction of full debuginfo's size and link time.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# id_effect's Dylint lints, pinned to the id_effect release in use (`moon run :lint-effect`).
[workspace.metadata.dylint]
libraries = [
  { git = "https://github.com/Industrial/id_effect", tag = "v0.13.0", pattern = "lints/id_effect_lints" },
]
