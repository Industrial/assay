# release-plz: release PRs and crates.io publishing (config: release-plz.toml).
#
# Required repository secrets:
#   RELEASE_PLZ_TOKEN     Fine-grained PAT (or GitHub App token) with Contents: read & write and
#                         Pull requests: read & write on this repository. Needed because tags
#                         and PRs created with the default GITHUB_TOKEN do not trigger other
#                         workflows: the `v*` tag must start release.yml (cargo-dist), and the
#                         release PR must get CI (ci-pass) runs. The token's owner authors the
#                         release PR/commit.
#   CARGO_REGISTRY_TOKEN  crates.io API token with publish-update scope for nix-assay, nixq,
#                         nixdrv, nixstore and nixfetch.
# Also enable Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests" if the PAT is ever swapped for GITHUB_TOKEN.
name: release-plz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  # Publish to crates.io and push the `v<version>` tag — only when the release PR was merged
  # (release_always = false), otherwise a no-op.
  release:
    name: release
    if: github.repository == 'Industrial/assay'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: ./.github/actions/setup-rust
      - uses: release-plz/action@6caa8d34f74d82b0dc76a18edd1cc3d6801c9baf # v0.5.143
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  # Open or update the release PR (version bump + CHANGELOG.md).
  release-pr:
    name: release PR
    if: github.repository == 'Industrial/assay'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: ./.github/actions/setup-rust
      - uses: release-plz/action@6caa8d34f74d82b0dc76a18edd1cc3d6801c9baf # v0.5.143
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
