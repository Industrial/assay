[package]
name = "nixdrv"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "nixdrv — derivation ATerm/JSON parse, project outs/inputs, CA store-path helpers"
license = "MIT"
repository = "https://github.com/Industrial/assay"
homepage = "https://github.com/Industrial/assay"
documentation = "https://docs.rs/nixdrv"
readme = "README.md"
keywords = ["nix", "derivation"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
hex = "0.4"
rstest = "0.23"
nixq = { path = "../nixq", version = "0.1.0" }

id_effect = { version = "0.4.0", features = ["schema-serde"] }
id_effect_macro = "0.4.0"
id_effect_proc_macro = "0.4.0"
id_effect_cli = { version = "0.4.0", optional = true }

[features]
default = ["cli-exit"]
cli-exit = ["dep:id_effect_cli"]

[lib]
name = "nixdrv"
path = "src/lib/mod.rs"

[[bin]]
name = "nixdrv"
path = "src/main.rs"
