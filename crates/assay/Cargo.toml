[package]
name = "nix-assay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Assay — Nix unit testing: claim algebra + isolated eval runner"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nix-assay"
readme = "README.md"
# bin_contract reads workspace files (nix/assay/tests) and the unpublished harness crate.
exclude = ["tests/bin_contract.rs", "tests/golden/**"]
keywords = ["nix", "testing", "unit-test", "dsl"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
nixq.workspace = true
nixdrv.workspace = true
nixstore.workspace = true
# `tokio::process` (nix, killed when a case is interrupted) and oneshot channels for the live
# adapters; the runtime itself is id_effect's.
tokio = { workspace = true, features = ["fs", "process", "sync"] }

# `schema-serde`: `serde_json::Value` <-> `Unknown` for the claim codec (schema.rs).
id_effect = { workspace = true, features = ["schema-serde"] }
# The bin's run edge (`run_main`: Ctrl-C -> 130, defect -> 101); always linked.
id_effect_cli.workspace = true

[features]
# Exposes the in-memory fakes (`MockNixEval`, `SyncEval`) for dependents' tests.
test-support = ["nixstore/test-support"]

[lints]
workspace = true

[lib]
name = "assay"
path = "src/lib/mod.rs"

[[bin]]
name = "assay"
path = "src/main.rs"

[dev-dependencies]
# Property tests (laws, claim codec round trips) on `id_effect::testing::property`.
id_effect = { workspace = true, features = ["schema-serde", "proptest"] }
proptest = "1"
nixstore = { workspace = true, features = ["test-support"] }
bin-contract-support.workspace = true
