# Root-level workspace tasks
# https://moonrepo.dev/docs/config/project
id: 'workspace'
language: 'rust'
layer: 'application'
workspace:
  inheritedTasks:
    exclude:
      - check
      - test
tasks:
  format:
    description: 'Format the workspace with treefmt (Rust, Nix, shell, JS/TS, YAML, TOML)'
    command: 'treefmt'
    inputs:
      - 'treefmt.toml'
      - '.git/**/*'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
      - '.github/workflows/*.yml'
    options:
      cache: false
      outputStyle: buffer-only-failure
  ci-format:
    description: 'Format check for CI (treefmt with fail-on-change)'
    command: 'treefmt'
    args: ['--config-file', 'treefmt.ci.toml']
    inputs:
      - 'treefmt.ci.toml'
      - '.git/**/*'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
      - '.github/workflows/*.yml'
    options:
      cache: false
      outputStyle: buffer-only-failure
  audit:
    description: 'Run cargo audit for known Rust security advisories'
    command: 'cargo'
    args: ['audit']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
    options:
      outputStyle: buffer-only-failure
  coverage:
    description: 'Run tests with llvm-cov and generate HTML coverage report'
    command: 'cargo'
    args: ['llvm-cov', 'nextest']
    deps: ['~:format']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
  # blaze is the default Rust build command: it keeps the workspace compiled in
  # a daemon and rebuilds only what changed. Moon caching stays off for the
  # blaze targets — blaze has its own content-addressed store and is already
  # faster than a moon cache lookup, and double-caching only hides staleness.
  build:
    description: 'Build the workspace with blaze'
    command: 'blaze'
    args: ['build', '--workspace']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/*.rs'
    options:
      cache: false
      outputStyle: buffer-only-failure
  check:
    description: 'Check the workspace compiles (blaze)'
    command: 'blaze'
    args: ['check', '--workspace', '--all-features']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/*.rs'
    options:
      cache: false
      outputStyle: buffer-only-failure
  cargo-build:
    description: 'Build the workspace with cargo (rustc verification path)'
    command: 'cargo'
    args: ['build']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  cargo-check:
    description: 'Check the workspace with cargo — rustc is the final word on the verdict'
    command: 'cargo'
    args: ['check', '--workspace', '--all-features']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  lint:
    description: 'Run fmt --check and clippy'
    command: 'bash'
    args: ['-c', 'cargo fmt --all -- --check && cargo clippy --workspace -- -D warnings']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      outputStyle: buffer-only-failure
  lint-effect:
    description: 'Run id_effect_lints (Dylint) over the workspace; any warning fails'
    command: 'bash'
    args: ['scripts/dylint.sh']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - 'scripts/dylint.sh'
    options:
      outputStyle: buffer-only-failure
  test:
    description: 'Run tests with blaze (unit, integration and doctests)'
    command: 'blaze'
    args: ['test', '--workspace']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - 'tests/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
  cargo-test:
    description: 'Run tests with nextest under rustc — the verification path'
    command: 'cargo'
    args: ['nextest', 'run']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - 'tests/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
  docs:
    description: 'Build documentation'
    command: 'cargo'
    args: ['doc', '--no-deps', '--all-features']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  fix:
    description: 'Auto-fix with cargo fix and clippy --fix'
    command: 'bash'
    args: ['-c', 'cargo fix --allow-dirty --allow-staged --workspace --all-features && cargo clippy --fix --allow-dirty --allow-staged --workspace --all-features -- -D warnings']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
      outputStyle: buffer-only-failure
  bench:
    description: 'Run benchmarks (no-op if no benches)'
    command: 'bash'
    args: ['-c', 'if [ -d benches ]; then cargo bench; else echo "No benches/ directory"; fi']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - 'benches/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
  check-docs:
    description: 'Build docs and run clippy (-D warnings)'
    command: 'bash'
    args: ['-c', 'RUSTDOCFLAGS="" cargo doc --all-features --no-deps 2>&1 | tee log/docs-warnings.log | grep -E "(warning|error|Documenting|Finished)" || true && cargo clippy --lib --all-features -- -D warnings']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      outputStyle: buffer-only-failure
  assay:
    description: 'Run in-repo Assay DSL smoke + dogfood suites'
    command: 'bash'
    args:
      - '-c'
      - 'cargo build -p nix-assay && ./target/debug/assay run nix/assay/tests/smoke.assay.nix && ./target/debug/assay run nix/assay/tests/dogfood.assay.nix'
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/assay/**/*'
      - 'nix/assay/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
