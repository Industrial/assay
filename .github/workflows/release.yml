# Release on a `v<version>` tag (see docs/RELEASING.md):
#   verify  -> the tag matches [workspace.package] version, CHANGELOG.md has that section, and
#              the crates package
#   build   -> one tarball + .sha256 per target (`assay-<target>.tar.gz` holding
#              `assay-<target>/assay`; Nix consumers such as cursor-setup fetch this name)
#   release -> only after every build succeeds: checks the checksums, attests build provenance,
#              creates the GitHub release with SHA256SUMS and the CHANGELOG section as notes
#   publish -> `cargo publish --workspace` to crates.io (secret CARGO_REGISTRY_TOKEN, environment
#              `crates-io`) once the GitHub release exists
name: release
on:
  push:
    tags: ["v[0-9]*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
defaults:
  run:
    shell: bash
jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml)
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error file=Cargo.toml::tag $TAG does not match [workspace.package] version $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [$version]' section"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
      # Packages every crate against the others' local versions, so a manifest that cannot be
      # published fails here instead of half-way through `publish`.
      - run: cargo package --workspace --locked
  build:
    name: build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported runners per platform, so the glibc / macOS floor stays low.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo build -p nix-assay --release --locked --target ${{ matrix.target }}
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          asset="assay-$TARGET"
          mkdir -p "dist/$asset"
          install -m 0755 "target/$TARGET/release/assay" "dist/$asset/assay"
          "dist/$asset/assay" --version
          tar -C dist -czf "dist/$asset.tar.gz" "$asset"
          (cd dist && shasum -a 256 "$asset.tar.gz" > "$asset.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assay-${{ matrix.target }}
          path: |
            dist/assay-${{ matrix.target }}.tar.gz
            dist/assay-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
  release:
    name: GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: assay-*
          merge-multiple: true
      - name: Check checksums
        working-directory: dist
        run: |
          sha256sum -c ./*.sha256
          cat ./*.sha256 > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md \
            dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS
  publish:
    name: crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # Publishes in dependency order (nixstore, nixq, nixdrv, nixfetch, nix-assay). A crate whose
      # version is already on crates.io stops the run; see docs/RELEASING.md to resume.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
