name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: assay-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: assay-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            asset: assay-x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build -p assay --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/assay
          stage=${{ matrix.asset }}
          mkdir -p dist/$stage
          cp "$bin" dist/$stage/assay
          chmod +x dist/$stage/assay
          tar -C dist -czf dist/${{ matrix.asset }}.tar.gz $stage
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}.tar.gz
          generate_release_notes: true
