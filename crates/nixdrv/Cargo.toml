[package]
name = "nixdrv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "nixdrv — derivation ATerm/JSON parse, project outs/inputs, CA store-path helpers"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nixdrv"
readme = "README.md"
# bin_contract uses the unpublished workspace harness crate.
exclude = ["tests/bin_contract.rs", "tests/golden/**"]
keywords = ["nix", "derivation"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
hex.workspace = true
nixq.workspace = true
nixstore.workspace = true

id_effect.workspace = true
# The bin's run edge (`run_main`: Ctrl-C -> 130, defect -> 101); always linked.
id_effect_cli.workspace = true

[dev-dependencies]
rstest = "0.23"
nixq = { workspace = true, features = ["test-support"] }
bin-contract-support.workspace = true

[lints]
workspace = true

[lib]
name = "nixdrv"
path = "src/lib/mod.rs"

[[bin]]
name = "nixdrv"
path = "src/main.rs"
