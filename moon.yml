# Root-level workspace tasks
# https://moonrepo.dev/docs/config/project
id: 'workspace'
language: 'rust'
layer: 'application'
workspace:
  inheritedTasks:
    exclude:
      - check
      - test
tasks:
  format:
    description: 'Format the workspace with treefmt (Rust, Nix, shell, JS/TS, YAML, TOML)'
    command: 'treefmt'
    inputs:
      - 'treefmt.toml'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
    options:
      cache: false
      outputStyle: buffer-only-failure
  ci-format:
    description: 'Format check for CI: fails if treefmt would change any file'
    command: 'treefmt'
    args: ['--fail-on-change']
    inputs:
      - 'treefmt.toml'
      - '**/*.rs'
      - '**/*.nix'
      - '**/*.sh'
      - '**/*.{js,jsx,ts,tsx,json}'
      - '**/*.{yml,yaml}'
      - '**/*.toml'
    options:
      cache: false
      outputStyle: buffer-only-failure
  audit:
    description: 'Run cargo audit for known Rust security advisories'
    command: 'cargo'
    args: ['audit']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
    options:
      outputStyle: buffer-only-failure
  deny:
    description: 'Run cargo deny (advisories, licenses, bans, sources; deny.toml)'
    command: 'cargo'
    args: ['deny', 'check']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'deny.toml'
    options:
      cache: false
      outputStyle: buffer-only-failure
  coverage:
    description: 'Run tests under llvm-cov (nextest coverage profile)'
    command: 'cargo'
    args: ['llvm-cov', 'nextest', '--workspace', '--all-features', '--profile', 'coverage']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
  build:
    description: 'Build the workspace with cargo'
    command: 'cargo'
    args: ['build', '--workspace']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  check:
    description: 'Check the workspace compiles'
    command: 'cargo'
    args: ['check', '--workspace', '--all-features']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  lint:
    description: 'Run fmt --check and clippy on every target (-D warnings)'
    command: 'bash'
    args:
      - '-c'
      - 'cargo fmt --all -- --check && cargo clippy --workspace --all-targets --all-features -- -D warnings'
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - '**/*.rs'
    options:
      outputStyle: buffer-only-failure
  lint-effect:
    description: 'Run id_effect_lints (Dylint) over the workspace; any warning fails'
    command: 'bash'
    args: ['scripts/dylint.sh']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - 'scripts/dylint.sh'
    options:
      outputStyle: buffer-only-failure
  test:
    description: 'Run tests with nextest (NEXTEST_PROFILE=ci in CI), after the doctests'
    command: 'cargo'
    args: ['nextest', 'run', '--workspace', '--all-features']
    deps: ['~:test-doc']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.config/nextest.toml'
      - '**/*.rs'
      - 'crates/**/*'
      - 'nix/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
  test-doc:
    description: 'Run doctests (nextest does not run them)'
    command: 'cargo'
    args: ['test', '--doc', '--workspace', '--all-features']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
      outputStyle: buffer-only-failure
  docs:
    description: 'Build documentation'
    command: 'cargo'
    args: ['doc', '--workspace', '--no-deps', '--all-features']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: true
      outputStyle: buffer-only-failure
  check-docs:
    description: 'Build docs; any rustdoc warning (broken link, bad markup) fails'
    command: 'cargo'
    args: ['doc', '--workspace', '--no-deps', '--all-features']
    env:
      RUSTDOCFLAGS: '-D warnings'
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
      - '**/*.md'
    options:
      outputStyle: buffer-only-failure
  fix:
    description: 'Auto-fix with cargo fix and clippy --fix'
    command: 'bash'
    args: ['-c', 'cargo fix --allow-dirty --allow-staged --workspace --all-features && cargo clippy --fix --allow-dirty --allow-staged --workspace --all-features -- -D warnings']
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/*.rs'
    options:
      cache: false
      outputStyle: buffer-only-failure
  assay:
    description: 'Run in-repo Assay DSL smoke + dogfood suites'
    command: 'bash'
    args:
      - '-c'
      - 'cargo build -p nix-assay && ./target/debug/assay run nix/assay/tests/smoke.assay.nix && ./target/debug/assay run nix/assay/tests/dogfood.assay.nix'
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/assay/**/*'
      - 'nix/assay/**/*'
    options:
      cache: false
      outputStyle: buffer-only-failure
