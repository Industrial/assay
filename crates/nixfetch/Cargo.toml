[package]
name = "nixfetch"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "nixfetch — fixed-output fetchurl/fetchgit download + flat/NAR hash verify"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nixfetch"
readme = "README.md"
exclude = ["fixtures/**"]
keywords = ["nix", "fetch", "hash"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
base64 = "0.22"
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
nixdrv = { path = "../nixdrv", version = "0.2.1" }
nixstore = { path = "../nixstore", version = "0.2.1" }
# Async client: it runs as a task on the id_effect (tokio) executor; `reqwest::blocking` would
# panic inside the runtime and park an executor thread.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
# `tokio::process` (git, killed when an attempt is dropped) and oneshot channels for the live
# adapters; the runtime itself is id_effect's.
tokio = { version = "1", default-features = false, features = [
  "process",
  "sync",
] }

id_effect = "0.13.0"
# The bin's run edge (`run_main`: Ctrl-C -> 130, defect -> 101); always linked.
id_effect_cli = "0.13.0"

[features]
default = ["cli-exit"]
# Kept for compatibility: id_effect_cli is no longer optional, so this is a no-op.
cli-exit = []
# Exposes the in-memory fakes (`MemFs`, `FakeHttp`, `FakeGit`) for dependents' tests.
test-support = []

[lib]
name = "nixfetch"
path = "src/lib/mod.rs"

[[bin]]
name = "nixfetch"
path = "src/main.rs"
