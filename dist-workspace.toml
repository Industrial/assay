# cargo-dist (https://axodotdev.github.io/cargo-dist/) — builds the `assay` binary on the
# `v*` tag pushed by release-plz (.github/workflows/release-plz.yml), creates the GitHub
# release with notes from CHANGELOG.md, and uploads archives, sha256 checksums and the shell
# installer. Regenerate the workflow after editing this file: `dist generate`, then check with
# `dist plan`.

[workspace]
members = ["cargo:."]

[dist]
# The version of dist that generated .github/workflows/release.yml.
cargo-dist-version = "0.33.1"
ci = "github"
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
# `curl --proto '=https' --tlsv1.2 -LsSf …/nix-assay-installer.sh | sh`; the installer checks
# each archive against its published sha256.
installers = ["shell"]
install-path = "CARGO_HOME"
install-updater = false
unix-archive = ".tar.gz"
checksum = "sha256"
# release-plz only pushes the tag; dist owns the GitHub release (one creator, no race).
create-release = true
hosting = "github"
# PRs run `dist plan` only (cheap) to catch config drift; builds happen on the tag.
pr-run-mode = "plan"
# Legacy `assay-<target>.tar.gz` assets (layout `assay-<target>/assay`) for Industrial/cursor-setup
# and anyone else pinning the pre-dist release URLs.
post-announce-jobs = ["./release-legacy-assets"]
# The workflow carries `# vX.Y.Z` comments on the SHA pins and Dependabot bumps them, so dist
# must not fail `plan` when the generated file differs textually.
allow-dirty = ["ci"]

# Every action pinned to a full commit SHA (the `# vX.Y.Z` comments live in release.yml).
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"          # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"   # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2

[dist.github-custom-runners]
# dist's default for x86_64 macOS (macos-13) is retired.
x86_64-apple-darwin = "macos-15-intel"
aarch64-apple-darwin = "macos-15"
# Native arm64 runner instead of cross-compiling.
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
