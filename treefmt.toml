# One CLI to format the code tree - https://github.com/numtide/treefmt
# Local: `treefmt` (`moon run :format`). CI: `treefmt --fail-on-change` (`moon run :ci-format`).

# Log paths that did not match any formatters at the specified log level
on-unmatched = "warn"

verbose = 1

# Only format files tracked by git
walk = "git"

[formatter.deadnix]
command = "deadnix"
includes = ["*.nix"]
priority = 0

[formatter.nix]
command = "alejandra"
includes = ["*.nix"]
priority = 1

[formatter.github-actions]
command = "actionlint"
includes = [".github/workflows/*.yml"]
priority = 2

[formatter.bash]
command = "beautysh"
includes = ["*.sh", ".envrc"]
priority = 3

[formatter.javascript]
command = "biome"
options = ["format", "--write"]
includes = ["*.{js,jsx,ts,tsx,json}"]
# Golden files are byte-exact test expectations; reformatting breaks them.
excludes = ["crates/*/testdata/**", "crates/*/tests/golden/**"]
priority = 4

[formatter.yaml]
command = "yamlfmt"
includes = ["*.{yml,yaml}"]
priority = 5

[formatter.toml]
command = "taplo"
options = ["format"]
includes = ["*.toml"]
priority = 6

[formatter.rust]
command = "rustfmt"
options = ["--edition", "2024"]
includes = ["*.rs"]
priority = 7
