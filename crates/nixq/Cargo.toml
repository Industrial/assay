[package]
name = "nixq"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "nixq — JSON/attrpath query: get, hasAttrs, subset, force-path, normalize, diff"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nixq"
readme = "README.md"
keywords = ["nix", "json", "query"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
nixstore = { path = "../nixstore", version = "0.2.1" }

id_effect = { version = "0.4.0", features = ["schema-serde"] }
id_effect_macro = "0.4.0"
id_effect_proc_macro = "0.4.0"
id_effect_cli = { version = "0.4.0", optional = true }
id_effect_optics = { version = "0.4.0", optional = true }

[features]
default = ["cli-exit", "optics"]
cli-exit = ["dep:id_effect_cli"]
optics = ["dep:id_effect_optics"]

[lib]
name = "nixq"
path = "src/lib/mod.rs"

[[bin]]
name = "nixq"
path = "src/main.rs"
