[package]
name = "nixq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "nixq — JSON/attrpath query: get, hasAttrs, subset, force-path, normalize, diff"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nixq"
readme = "README.md"
# bin_contract reads nixstore's fixtures and the unpublished workspace harness crate.
exclude = ["tests/bin_contract.rs", "tests/golden/**"]
keywords = ["nix", "json", "query"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
nixstore.workspace = true

id_effect.workspace = true
# The bin's run edge (`run_main`: Ctrl-C -> 130, defect -> 101); always linked.
id_effect_cli.workspace = true

[dev-dependencies]
nixstore = { workspace = true, features = ["test-support"] }
bin-contract-support.workspace = true

[features]
# Exposes `MockJsonSource` (in-memory fake) for dependents' tests.
test-support = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "nixq"
path = "src/lib/mod.rs"

[[bin]]
name = "nixq"
path = "src/main.rs"
