[package]
name = "nix-assay"
version = "0.1.0"
edition = "2024"
authors = ["Industrial <tom.wieland@gmail.com>"]
description = "Assay — Nix unit testing: claim algebra + isolated eval runner"
license = "MIT"
repository = "https://github.com/Industrial/assay"
homepage = "https://github.com/Industrial/assay"
documentation = "https://docs.rs/nix-assay"
readme = "README.md"
keywords = ["nix", "testing", "unit-test", "dsl"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
proptest = { version = "1", optional = true }
nixq = { path = "../nixq", version = "0.1.0" }
nixdrv = { path = "../nixdrv", version = "0.1.0" }
nixstore = { path = "../nixstore", version = "0.1.0" }

id_effect = { version = "0.4.0", features = ["schema-serde"] }
id_effect_macro = "0.4.0"
id_effect_proc_macro = "0.4.0"
id_effect_cli = { version = "0.4.0", optional = true }
id_effect_optics = { version = "0.4.0", optional = true }

[features]
default = ["cli-exit", "optics"]
cli-exit = ["dep:id_effect_cli"]
process-pool = []                                 # reserved; id_effect_process not on crates.io yet
optics = ["dep:id_effect_optics"]
proptest = ["id_effect/proptest", "dep:proptest"]

[lib]
name = "assay"
path = "src/lib/mod.rs"

[[bin]]
name = "assay"
path = "src/main.rs"
