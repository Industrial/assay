# actionlint config (`actionlint` from the repo root).
paths:
  # Generated by cargo-dist (`dist generate`); its shell style nits are upstream's and would be
  # reintroduced on every regeneration. Expression/schema checks still apply.
  .github/workflows/release.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:'
      - 'shellcheck reported issue in this script: SC2129:'
