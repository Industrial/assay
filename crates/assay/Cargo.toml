[package]
name = "nix-assay"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Assay — Nix unit testing: claim algebra + isolated eval runner"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nix-assay"
readme = "README.md"
keywords = ["nix", "testing", "unit-test", "dsl"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
nixq = { path = "../nixq", version = "0.2.1" }
nixdrv = { path = "../nixdrv", version = "0.2.1" }
nixstore = { path = "../nixstore", version = "0.2.1" }
# `tokio::process` (nix, killed when a case is interrupted) and oneshot channels for the live
# adapters; the runtime itself is id_effect's.
tokio = { version = "1", default-features = false, features = [
  "fs",
  "process",
  "sync",
] }

# `schema-serde`: `serde_json::Value` <-> `Unknown` for the claim codec (schema.rs).
id_effect = { version = "0.13.0", features = ["schema-serde"] }
# The bin's run edge (`run_main`: Ctrl-C -> 130, defect -> 101); always linked.
id_effect_cli = "0.13.0"

[features]
default = ["cli-exit"]
# Kept for compatibility: id_effect_cli is no longer optional, so this is a no-op.
cli-exit = []
process-pool = [] # reserved; id_effect_process not on crates.io yet
# Exposes the in-memory fakes (`MockNixEval`, `SyncEval`) for dependents' tests.
test-support = ["nixstore/test-support"]

[lib]
name = "assay"
path = "src/lib/mod.rs"

[[bin]]
name = "assay"
path = "src/main.rs"

[dev-dependencies]
criterion = "0.8.2"
# Property tests (laws, claim codec round trips) on `id_effect::testing::property`.
id_effect = { version = "0.13.0", features = ["schema-serde", "proptest"] }
proptest = "1"
nixstore = { path = "../nixstore", version = "0.2.1", features = [
  "test-support",
] }
