[package]
name = "nixstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "nixstore — read-only Nix store path-info from db.sqlite"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nixstore"
readme = "README.md"
keywords = ["nix", "store"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }

id_effect = "0.13.0"
# The bin's run edge (`run_main`: Ctrl-C -> 130, defect -> 101); always linked.
id_effect_cli = "0.13.0"

[features]
default = ["cli-exit"]
# Kept for compatibility: id_effect_cli is no longer optional, so this is a no-op.
cli-exit = []
# Exposes `MockPathInfoStore` (in-memory fake) for dependents' tests.
test-support = []

[lints]
workspace = true

[lib]
name = "nixstore"
path = "src/lib/mod.rs"

[[bin]]
name = "nixstore"
path = "src/main.rs"
