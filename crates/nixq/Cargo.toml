[package]
name = "nixq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "nixq — JSON/attrpath query: get, hasAttrs, subset, force-path, normalize, diff"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nixq"
readme = "README.md"
keywords = ["nix", "json", "query"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
nixstore = { path = "../nixstore", version = "0.3.0" }

id_effect = "0.13.0"
# The bin's run edge (`run_main`: Ctrl-C -> 130, defect -> 101); always linked.
id_effect_cli = "0.13.0"

[dev-dependencies]
nixstore = { path = "../nixstore", version = "0.3.0", features = [
  "test-support",
] }

[features]
default = ["cli-exit"]
# Kept for compatibility: id_effect_cli is no longer optional, so this is a no-op.
cli-exit = []
# Exposes `MockJsonSource` (in-memory fake) for dependents' tests.
test-support = []

[lints]
workspace = true

[lib]
name = "nixq"
path = "src/lib/mod.rs"

[[bin]]
name = "nixq"
path = "src/main.rs"
