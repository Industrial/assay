# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Run: `cargo deny check` (`moon run :deny`, pre-push, CI).

[graph]
all-features = true

[advisories]
# Vulnerabilities and unsound advisories always fail; unmaintained only for direct deps.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Only the licenses the current dependency graph actually uses.
# CDLA-Permissive-2.0: webpki-roots (Mozilla CA bundle, via reqwest/rustls in nixfetch).
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path deps are fine; published crates still need a `version` on them (cargo enforces it).
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
